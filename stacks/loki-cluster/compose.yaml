services:
  loki:
    image: grafana/loki:3.7.8
    container_name: loki
    restart: unless-stopped
    network_mode: host
    command:
    - -config.file=/etc/loki/loki.yaml
    - -config.expand-env=true
    - -target=all
    environment:
      NODE_IP: ${NODE_IP:?provided by ansible (ansible/stacks.yaml)}
      BENCH_PASSWORD: ${BENCH_PASSWORD:?provided by ansible (ansible/stacks.yaml)}
    volumes:
    - ./loki.yaml:/etc/loki/loki.yaml:ro
    - loki:/loki
    mem_limit: ${MAIN_MEM:-2048m}

  # loki has no ui of its own, so grafana is part of the stack and of its
  # cpu/memory numbers, the same way kibana is for elk
  grafana:
    image: grafana/grafana:13.2.2
    container_name: loki-grafana
    restart: unless-stopped
    network_mode: host
    profiles:
    - node1
    environment:
      GF_SERVER_HTTP_PORT: "3000"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
    - ./grafana/provisioning:/etc/grafana/provisioning:ro
    - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    - grafana:/var/lib/grafana
    depends_on:
    - loki
    mem_limit: 448m

  # bitnamilegacy, not quay.io/minio: the upstream images were pulled from
  # docker hub in 09.2026 and the quay copies followed on 24.09. Same minio,
  # bitnami packaging: data under /bitnami/minio/data, bucket created by
  # MINIO_DEFAULT_BUCKETS so no mc init container is needed.
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    container_name: minio
    restart: unless-stopped
    network_mode: host
    profiles:
    - node1
    environment:
      MINIO_ROOT_USER: bench
      MINIO_ROOT_PASSWORD: ${BENCH_PASSWORD:?provided by ansible (ansible/stacks.yaml)}
      MINIO_DEFAULT_BUCKETS: loki
      MINIO_PROMETHEUS_AUTH_TYPE: public
    volumes:
    - minio:/bitnami/minio/data
    mem_limit: 640m

volumes:
  loki:
  grafana:
  minio:
