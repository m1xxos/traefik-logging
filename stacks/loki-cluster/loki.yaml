auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9095
  log_level: warn

common:
  path_prefix: /loki
  replication_factor: 3
  compactor_address: http://backend-1:3100
  ring:
    kvstore:
      store: memberlist
    instance_addr: ${NODE_IP}
  storage:
    s3:
      endpoint: backend-1:9000
      bucketnames: loki
      access_key_id: bench
      secret_access_key: ${BENCH_PASSWORD}
      region: us-east-1
      s3forcepathstyle: true
      insecure: true

memberlist:
  bind_port: 7946
  advertise_addr: ${NODE_IP}
  join_members:
  - backend-1:7946
  - backend-2:7946
  - backend-3:7946

schema_config:
  configs:
  - from: "2026-01-01"
    store: tsdb
    object_store: s3
    schema: v13
    index:
      prefix: index_
      period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache

ingester:
  wal:
    dir: /loki/wal
  chunk_target_size: 1572864

# querier caps: an explore log-volume query (count_over_time [2s] by level
# over 15 minutes) pushed loki past its memory limit on the cluster run
querier:
  max_concurrent: 2

limits_config:
  max_query_parallelism: 4
  allow_structured_metadata: true
  volume_enabled: true
  retention_period: 168h
  reject_old_samples: true
  ingestion_rate_mb: 64
  ingestion_burst_size_mb: 128
  per_stream_rate_limit: 32MB
  per_stream_rate_limit_burst: 64MB
  max_label_names_per_series: 15

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: s3

pattern_ingester:
  enabled: false

analytics:
  reporting_enabled: false
