services:
  openobserve:
    image: openobserve/openobserve:v1.0.3
    container_name: openobserve
    restart: unless-stopped
    network_mode: host
    environment:
      ZO_LOCAL_MODE: "false"
      ZO_NODE_ROLE: all
      ZO_INSTANCE_NAME: backend-${NODE_INDEX:?provided by ansible (ansible/stacks.yaml)}
      ZO_CLUSTER_COORDINATOR: nats
      ZO_NATS_ADDR: backend-1:4222
      # one nats, so jetstream cannot hold 3 replicas of the kv buckets
      ZO_NATS_REPLICAS: "1"
      ZO_META_STORE: postgres
      ZO_META_POSTGRES_DSN: postgres://o2:${BENCH_PASSWORD}@backend-1:5432/openobserve
      ZO_S3_PROVIDER: minio
      ZO_S3_SERVER_URL: http://backend-1:9000
      ZO_S3_REGION_NAME: us-east-1
      ZO_S3_BUCKET_NAME: openobserve
      ZO_S3_ACCESS_KEY: bench
      ZO_S3_SECRET_KEY: ${BENCH_PASSWORD:?provided by ansible (ansible/stacks.yaml)}
      ZO_DATA_DIR: /data
      ZO_DISK_CACHE_MAX_SIZE: "2048"
      ZO_ROOT_USER_EMAIL: root@example.com
      ZO_ROOT_USER_PASSWORD: ${BENCH_PASSWORD}
      ZO_PROMETHEUS_ENABLED: "true"
      ZO_TELEMETRY: "false"
    volumes:
    - o2data:/data
    mem_limit: ${MAIN_MEM:-2048m}

  nats:
    image: nats:2.15.0-alpine
    container_name: nats
    restart: unless-stopped
    network_mode: host
    profiles:
    - node1
    command:
    - -js
    - -sd
    - /data
    - -m
    - "8222"
    volumes:
    - nats:/data
    mem_limit: 256m

  postgres:
    image: postgres:18.6-alpine
    container_name: postgres
    restart: unless-stopped
    network_mode: host
    profiles:
    - node1
    command:
    - -c
    - shared_buffers=64MB
    environment:
      POSTGRES_DB: openobserve
      POSTGRES_USER: o2
      POSTGRES_PASSWORD: ${BENCH_PASSWORD:?provided by ansible (ansible/stacks.yaml)}
    volumes:
    - pgdata:/var/lib/postgresql
    mem_limit: 256m

  # bitnamilegacy, not quay.io/minio: the upstream images were pulled from
  # docker hub in 09.2026 and the quay copies followed on 24.09. Same minio,
  # bitnami packaging: data under /bitnami/minio/data, bucket created by
  # MINIO_DEFAULT_BUCKETS so no mc init container is needed.
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    container_name: minio
    restart: unless-stopped
    network_mode: host
    profiles:
    - node1
    environment:
      MINIO_ROOT_USER: bench
      MINIO_ROOT_PASSWORD: ${BENCH_PASSWORD:?provided by ansible (ansible/stacks.yaml)}
      MINIO_DEFAULT_BUCKETS: openobserve
      MINIO_PROMETHEUS_AUTH_TYPE: public
    volumes:
    - minio:/bitnami/minio/data
    mem_limit: 512m

volumes:
  o2data:
  nats:
  pgdata:
  minio:
