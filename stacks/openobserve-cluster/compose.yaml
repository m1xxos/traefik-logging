services:
  openobserve:
    image: openobserve/openobserve:v1.0.3
    container_name: openobserve
    restart: unless-stopped
    network_mode: host
    environment:
      ZO_LOCAL_MODE: "false"
      ZO_NODE_ROLE: all
      ZO_INSTANCE_NAME: backend-${NODE_INDEX:?provided by ansible (ansible/stacks.yaml)}
      ZO_CLUSTER_COORDINATOR: nats
      ZO_NATS_ADDR: backend-1:4222
      ZO_META_STORE: postgres
      ZO_META_POSTGRES_DSN: postgres://o2:${BENCH_PASSWORD}@backend-1:5432/openobserve
      ZO_S3_PROVIDER: minio
      ZO_S3_SERVER_URL: http://backend-1:9000
      ZO_S3_REGION_NAME: us-east-1
      ZO_S3_BUCKET_NAME: openobserve
      ZO_S3_ACCESS_KEY: bench
      ZO_S3_SECRET_KEY: ${BENCH_PASSWORD:?provided by ansible (ansible/stacks.yaml)}
      ZO_DATA_DIR: /data
      ZO_DISK_CACHE_MAX_SIZE: "2048"
      ZO_ROOT_USER_EMAIL: root@example.com
      ZO_ROOT_USER_PASSWORD: ${BENCH_PASSWORD}
      ZO_PROMETHEUS_ENABLED: "true"
      ZO_TELEMETRY: "false"
    volumes:
    - o2data:/data
    mem_limit: ${MAIN_MEM:-2048m}

  nats:
    image: nats:2.15.0-alpine
    container_name: nats
    restart: unless-stopped
    network_mode: host
    profiles:
    - node1
    command:
    - -js
    - -sd
    - /data
    - -m
    - "8222"
    volumes:
    - nats:/data
    mem_limit: 256m

  postgres:
    image: postgres:18.6-alpine
    container_name: postgres
    restart: unless-stopped
    network_mode: host
    profiles:
    - node1
    command:
    - -c
    - shared_buffers=64MB
    environment:
      POSTGRES_DB: openobserve
      POSTGRES_USER: o2
      POSTGRES_PASSWORD: ${BENCH_PASSWORD:?provided by ansible (ansible/stacks.yaml)}
    volumes:
    - pgdata:/var/lib/postgresql
    mem_limit: 256m

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio
    restart: unless-stopped
    network_mode: host
    profiles:
    - node1
    command:
    - server
    - /data
    - --address=:9000
    - --console-address=:9001
    environment:
      MINIO_ROOT_USER: bench
      MINIO_ROOT_PASSWORD: ${BENCH_PASSWORD:?provided by ansible (ansible/stacks.yaml)}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    volumes:
    - minio:/data
    mem_limit: 512m

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: minio-init
    restart: "no"
    network_mode: host
    profiles:
    - node1
    entrypoint: ["/bin/sh", "-c"]
    command:
    - |
      until mc alias set local http://127.0.0.1:9000 bench "$${BENCH_PASSWORD}"; do sleep 2; done
      mc mb -p local/openobserve
    environment:
      BENCH_PASSWORD: ${BENCH_PASSWORD:?provided by ansible (ansible/stacks.yaml)}
    depends_on:
    - minio

volumes:
  o2data:
  nats:
  pgdata:
  minio:
