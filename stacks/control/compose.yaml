services:
  vmsingle:
    image: victoriametrics/victoria-metrics:v1.152.0
    container_name: vmsingle
    restart: unless-stopped
    ports:
    - "8428:8428"
    command:
    - -storageDataPath=/vm
    - -retentionPeriod=90d
    - -httpListenAddr=:8428
    volumes:
    - vmdata:/vm
    mem_limit: 1024m

  vmagent:
    image: victoriametrics/vmagent:v1.152.0
    container_name: vmagent
    restart: unless-stopped
    ports:
    - "8429:8429"
    command:
    - -promscrape.config=/etc/vmagent/scrape.yaml
    - -promscrape.config.strictParse=false
    - -remoteWrite.url=http://vmsingle:8428/api/v1/write
    - -httpListenAddr=:8429
    environment:
      BACKEND: ${BACKEND:-none}
    volumes:
    - ./vmagent:/etc/vmagent:ro
    - vmagentdata:/vmagentdata
    depends_on:
    - vmsingle
    mem_limit: 256m

  grafana:
    image: grafana/grafana:13.2.2
    container_name: grafana
    restart: unless-stopped
    ports:
    - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_INSTALL_PLUGINS: victoriametrics-logs-datasource
    volumes:
    - ./grafana/provisioning:/etc/grafana/provisioning:ro
    - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    - grafana:/var/lib/grafana
    depends_on:
    - vmsingle
    mem_limit: 512m

  loadgen:
    build: ../loadgen
    image: loadgen:12.13.0
    container_name: loadgen
    restart: unless-stopped
    ports:
    - "8000:8000"
    volumes:
    - ../loadgen/targets:/targets:ro
    mem_limit: 256m

volumes:
  vmdata:
  vmagentdata:
  grafana:
