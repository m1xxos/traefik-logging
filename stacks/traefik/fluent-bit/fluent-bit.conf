[SERVICE]
    Flush                     1
    Grace                     10
    Log_Level                 info
    Parsers_File              parsers.conf
    HTTP_Server               On
    HTTP_Listen               0.0.0.0
    HTTP_Port                 2020
    storage.path              /var/lib/fluent-bit/storage
    storage.sync              normal
    storage.checksum          off
    storage.backlog.mem_limit 64M
    # 64 chunks of ~2 MB keep the in-memory backlog well under the container
    # limit; with 256 fluent-bit hit its 256m limit and stopped reading
    storage.max_chunks_up     64
    storage.metrics           on

# Rotate_Wait is how long a rotated file keeps being read. With 30s a slow
# backend lost 86% of a step: fluent-bit paused on backpressure, logrotate
# renamed the file, and the unread tail was abandoned half a minute later.
[INPUT]
    Name              tail
    Tag               traefik.access
    Path              /var/log/traefik/traefik-access.log
    Parser            traefik_access_json
    DB                /var/lib/fluent-bit/tail-access.db
    DB.sync           normal
    Refresh_Interval  5
    Rotate_Wait       600
    Read_from_Head    Off
    Skip_Long_Lines   On
    Buffer_Chunk_Size 512k
    Buffer_Max_Size   4M
    Mem_Buf_Limit     64M
    storage.type      filesystem

[INPUT]
    Name              tail
    Tag               traefik.internal
    Path              /var/log/traefik/traefik.log
    Parser            traefik_common
    DB                /var/lib/fluent-bit/tail-internal.db
    DB.sync           normal
    Refresh_Interval  5
    Rotate_Wait       600
    Read_from_Head    Off
    Mem_Buf_Limit     16M
    storage.type      filesystem

[FILTER]
    Name   record_modifier
    Match  *
    Record host ${FLB_HOST}

# traefik writes "msg":"" into every json access line
[FILTER]
    Name   modify
    Match  traefik.access
    Add    service traefik-access
    Remove msg

# traefik stamps level=info on every access line; derive it from the status
# instead so 5xx show up as errors in the log UIs. modify's regex condition
# only matches string values, hence the string copy of DownstreamStatus.
[FILTER]
    Name    type_converter
    Match   traefik.access
    int_key DownstreamStatus status_str string

[FILTER]
    Name      modify
    Match     traefik.access
    Condition Key_value_matches status_str ^5
    Set       level error

[FILTER]
    Name      modify
    Match     traefik.access
    Condition Key_value_matches status_str ^4
    Set       level warn

[FILTER]
    Name   modify
    Match  traefik.access
    Remove status_str

# zerolog console levels (INF/WRN/ERR/DBG) -> names the UIs understand
[FILTER]
    Name   modify
    Match  traefik.internal
    Add    service traefik

[FILTER]
    Name      modify
    Match     traefik.internal
    Condition Key_value_equals level INF
    Set       level info

[FILTER]
    Name      modify
    Match     traefik.internal
    Condition Key_value_equals level WRN
    Set       level warn

[FILTER]
    Name      modify
    Match     traefik.internal
    Condition Key_value_equals level ERR
    Set       level error

[FILTER]
    Name      modify
    Match     traefik.internal
    Condition Key_value_equals level DBG
    Set       level debug

@INCLUDE outputs/active.conf
