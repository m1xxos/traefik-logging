[SERVICE]
    Flush                     1
    Grace                     10
    Log_Level                 info
    Parsers_File              parsers.conf
    HTTP_Server               On
    HTTP_Listen               0.0.0.0
    HTTP_Port                 2020
    storage.path              /var/lib/fluent-bit/storage
    storage.sync              normal
    storage.checksum          off
    storage.backlog.mem_limit 64M
    storage.max_chunks_up     256
    storage.metrics           on

[INPUT]
    Name              tail
    Tag               traefik.access
    Path              /var/log/traefik/traefik-access.log
    Parser            traefik_access_json
    DB                /var/lib/fluent-bit/tail-access.db
    DB.sync           normal
    Refresh_Interval  5
    Rotate_Wait       30
    Read_from_Head    Off
    Skip_Long_Lines   On
    Buffer_Chunk_Size 512k
    Buffer_Max_Size   4M
    Mem_Buf_Limit     64M
    storage.type      filesystem

[INPUT]
    Name              tail
    Tag               traefik.internal
    Path              /var/log/traefik/traefik.log
    Parser            traefik_common
    DB                /var/lib/fluent-bit/tail-internal.db
    DB.sync           normal
    Refresh_Interval  5
    Rotate_Wait       30
    Read_from_Head    Off
    Mem_Buf_Limit     16M
    storage.type      filesystem

[FILTER]
    Name   record_modifier
    Match  *
    Record host ${FLB_HOST}

# traefik writes "msg":"" into every json access line
[FILTER]
    Name   modify
    Match  traefik.access
    Add    service traefik-access
    Remove msg

[FILTER]
    Name   modify
    Match  traefik.internal
    Add    service traefik

@INCLUDE outputs/active.conf
