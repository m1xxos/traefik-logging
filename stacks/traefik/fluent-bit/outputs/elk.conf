# Data streams only accept the create op; Suppress_Type_Name is mandatory on 8+.
[OUTPUT]
    Name                     es
    Match                    traefik.access
    Host                     ${LOG_TARGET}
    Port                     9200
    Index                    logs-traefik-access
    Suppress_Type_Name       On
    Logstash_Format          Off
    Write_Operation          create
    Generate_ID              Off
    Replace_Dots             On
    Buffer_Size              2MB
    Trace_Error              On
    compress                 gzip
    Workers                  2
    Retry_Limit              False
    storage.total_limit_size 2G

[OUTPUT]
    Name                     es
    Match                    traefik.internal
    Host                     ${LOG_TARGET}
    Port                     9200
    Index                    logs-traefik-internal
    Suppress_Type_Name       On
    Logstash_Format          Off
    Write_Operation          create
    Generate_ID              Off
    Replace_Dots             On
    Buffer_Size              2MB
    Trace_Error              On
    compress                 gzip
    Workers                  2
    Retry_Limit              False
    storage.total_limit_size 2G
