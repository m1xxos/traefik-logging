# Only host and service become labels (4 streams); everything with real
# cardinality stays in the line or goes to structured metadata.
[OUTPUT]
    Name                     loki
    Match                    traefik.*
    Host                     ${LOG_TARGET}
    Port                     3100
    Labels                   job=traefik
    Label_Keys               $host,$service,$ServiceName
    Remove_Keys              host,service
    Structured_Metadata      level=$level,status=$DownstreamStatus,method=$RequestMethod,router=$RouterName
    Line_Format              json
    Drop_Single_Key          off
    Auto_Kubernetes_Labels   off
    compress                 gzip
    Workers                  2
    Retry_Limit              False
    storage.total_limit_size 2G
