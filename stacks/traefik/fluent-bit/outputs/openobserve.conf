[OUTPUT]
    Name                     http
    Match                    traefik.access
    Host                     ${LOG_TARGET}
    Port                     5080
    URI                      /api/default/traefik_access/_json
    Format                   json
    Json_date_key            _timestamp
    Json_date_format         iso8601
    HTTP_User                root@example.com
    HTTP_Passwd              Bench-Traefik-2026!
    tls                      Off
    compress                 gzip
    Workers                  2
    Retry_Limit              False
    storage.total_limit_size 2G

[OUTPUT]
    Name                     http
    Match                    traefik.internal
    Host                     ${LOG_TARGET}
    Port                     5080
    URI                      /api/default/traefik_internal/_json
    Format                   json
    Json_date_key            _timestamp
    Json_date_format         iso8601
    HTTP_User                root@example.com
    HTTP_Passwd              Bench-Traefik-2026!
    tls                      Off
    compress                 gzip
    Workers                  2
    Retry_Limit              False
    storage.total_limit_size 2G
