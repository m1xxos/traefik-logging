[OUTPUT]
    Name                     http
    Match                    traefik.*
    Host                     ${LOG_TARGET}
    Port                     ${VL_PORT}
    URI                      /insert/jsonline
    Format                   json_lines
    Json_date_key            date
    Json_date_format         iso8601
    Header                   VL-Msg-Field message,RequestPath
    Header                   VL-Time-Field date
    Header                   VL-Stream-Fields host,service,ServiceName
    compress                 gzip
    Workers                  2
    Retry_Limit              False
    storage.total_limit_size 2G
