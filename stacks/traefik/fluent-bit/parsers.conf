[PARSER]
    Name        traefik_access_json
    Format      json
    Time_Key    time
    Time_Format %Y-%m-%dT%H:%M:%S%z
    Time_Keep   Off

# traefik v3 "common" format is zerolog console output:
# 2026-09-21T12:00:00Z INF Configuration loaded from file: ... providerName=file
[PARSER]
    Name        traefik_common
    Format      regex
    Regex       ^(?<time>\S+) (?<level>[A-Z]{3}) (?<message>.*)$
    Time_Key    time
    Time_Format %Y-%m-%dT%H:%M:%S%z
