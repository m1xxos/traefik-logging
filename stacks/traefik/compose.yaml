services:
  traefik:
    image: traefik:v3.7.13
    container_name: traefik
    restart: unless-stopped
    ports:
    - "80:80"
    - "8080:8080"
    environment:
      TZ: UTC
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
    - ./traefik.yaml:/etc/traefik/traefik.yaml:ro
    - ./dynamic:/etc/traefik/dynamic:ro
    # bind mount instead of a named volume so the host logrotate sees the files
    - /var/log/traefik:/var/log/traefik
    mem_limit: 512m

  # Four "services" behind the same traefik so the access log looks like a
  # real edge: routing by Host, different paths and methods, a share of 4xx
  # and 5xx, a few slow responses. go-httpbin answers whatever status or delay
  # the path asks for, whoami is the plain static service.
  api:
    image: mccutchen/go-httpbin:2.25.0
    container_name: api
    restart: unless-stopped
    mem_limit: 128m
    labels:
    - "traefik.enable=true"
    - "traefik.http.routers.api.entrypoints=web"
    - "traefik.http.routers.api.rule=Host(`api.bench`)"
    - "traefik.http.routers.api.service=api"
    - "traefik.http.services.api.loadbalancer.server.port=8080"

  shop:
    image: mccutchen/go-httpbin:2.25.0
    container_name: shop
    restart: unless-stopped
    mem_limit: 128m
    labels:
    - "traefik.enable=true"
    - "traefik.http.routers.shop.entrypoints=web"
    - "traefik.http.routers.shop.rule=Host(`shop.bench`)"
    - "traefik.http.routers.shop.service=shop"
    - "traefik.http.services.shop.loadbalancer.server.port=8080"

  auth:
    image: mccutchen/go-httpbin:2.25.0
    container_name: auth
    restart: unless-stopped
    mem_limit: 128m
    labels:
    - "traefik.enable=true"
    - "traefik.http.routers.auth.entrypoints=web"
    - "traefik.http.routers.auth.rule=Host(`auth.bench`)"
    - "traefik.http.routers.auth.service=auth"
    - "traefik.http.services.auth.loadbalancer.server.port=8080"

  static:
    image: traefik/whoami:v1.12.0
    container_name: static
    restart: unless-stopped
    mem_limit: 64m
    labels:
    - "traefik.enable=true"
    - "traefik.http.routers.static.entrypoints=web"
    - "traefik.http.routers.static.rule=Host(`static.bench`)"
    - "traefik.http.routers.static.service=static"
    - "traefik.http.services.static.loadbalancer.server.port=80"

  fluent-bit:
    image: fluent/fluent-bit:5.1.2
    container_name: fluent-bit
    restart: unless-stopped
    ports:
    - "2020:2020"
    environment:
      FLB_HOST: ${FLB_HOST:?provided by ansible (ansible/stacks.yaml)}
      LOG_TARGET: ${LOG_TARGET:?provided by ansible (ansible/stacks.yaml)}
      VL_PORT: ${VL_PORT:-9428}
    volumes:
    - ./fluent-bit:/fluent-bit/etc:ro
    - /var/log/traefik:/var/log/traefik:ro
    - fluent-bit-storage:/var/lib/fluent-bit
    mem_limit: 512m

volumes:
  fluent-bit-storage:
